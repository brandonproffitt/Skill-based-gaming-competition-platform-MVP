[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 5_000

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = true

[fmt]
line_length = 110
